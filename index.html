<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小千日記</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe7;
      --card: #fffaf3;
      --text: #2e241c;
      --muted: #756454;
      --line: #dccdbd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #fff8ef 0%, var(--bg) 58%, #eadfce 100%);
      color: var(--text);
      font-family: "Iowan Old Style", "Palatino Linotype", serif;
    }
    main {
      width: min(720px, 100%);
      padding: 40px 32px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 24px 60px rgba(63, 43, 26, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.04em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>小千日記已下架</h1>
    <p>這個頁面目前不再公開提供瀏覽。</p>
  </main>
</body>
</html>
